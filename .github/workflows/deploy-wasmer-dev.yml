
name: Deploy FleetFlow DEV to Wasmer

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleetflow-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy DEV
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, curl, fileinfo, pdo_pgsql, gd, intl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Laravel dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-scripts

      - name: Build React frontend
        run: |
          npm ci
          npm run build

      - name: Verify artifacts
        run: |
          test -f vendor/autoload.php
          test -f public/build/manifest.json
          test -f app.dev.yaml
          test -f wasmer.toml

      - name: Configure isolated DEV target and release version
        run: |
          cp app.dev.yaml app.yaml

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          # Validate the DEV app
          app = Path('app.yaml').read_text()

          name = re.search(
              r'(?m)^name:\s*(\S+)\s*$',
              app
          )

          app_id = re.search(
              r'(?m)^app_id:\s*(\S+)\s*$',
              app
          )

          if not name or name.group(1) != 'fleetflow-dev':
              raise SystemExit(
                  'Refusing deployment: expected fleetflow-dev'
              )

          if not app_id or 'REPLACE_' in app_id.group(1):
              raise SystemExit(
                  'Create Wasmer DEV app and set its app_id'
              )

          if app_id.group(1) == 'da_KgYIZt9Upk6B':
              raise SystemExit(
                  'SAFETY STOP: DEV points to production!'
              )

          # Configure the DEV package
          manifest = Path('wasmer.toml')
          content = manifest.read_text()

          run_number = int(os.environ['GITHUB_RUN_NUMBER'])
          version = f'0.2.{run_number - 1}'

          # Set DEV package name
          content, names = re.subn(
              r'(?m)^name\s*=\s*"[^"]+"',
              'name = "mabrenica_stormblue/fleetflow-dev"',
              content,
              count=1
          )

          # Set automatic DEV version
          content, versions = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"',
              f'version = "{version}"',
              content,
              count=1
          )

          # Match existing private DEV package
          content, visibility = re.subn(
              r'(?m)^private\s*=\s*(?:true|false)\s*$',
              'private = true',
              content,
              count=1
          )

          if names != 1 or versions != 1:
              raise SystemExit(
                  'Missing package name or version'
              )

          if visibility != 1:
              raise SystemExit(
                  'Missing private setting in wasmer.toml'
              )

          manifest.write_text(content)

          print(f'DEV app: {name.group(1)}')
          print(f'DEV app ID: {app_id.group(1)}')
          print('Package: mabrenica_stormblue/fleetflow-dev')
          print(f'Version: {version}')
          print('Package visibility: PRIVATE')
          PY

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v3.1

      - name: Deploy FleetFlow DEV
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          if [ -z "$WASMER_TOKEN" ]; then
            echo 'WASMER_TOKEN secret is missing'
            exit 1
          fi

          wasmer deploy --non-interactive
