
name: Deploy FleetFlow to Wasmer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleetflow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, curl, fileinfo, pdo_pgsql, gd, intl, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Laravel dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-scripts

      - name: Build React/Vite frontend
        run: |
          npm ci
          npm run build

      - name: Verify build artifacts
        run: |
          test -f vendor/autoload.php
          test -f public/build/manifest.json
          grep -Eq '^[[:space:]]*private[[:space:]]*=[[:space:]]*false' wasmer.toml

      
      - name: Set package version
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("wasmer.toml")
          content = manifest.read_text()

          # GitHub workflow run number
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])

          # Run #2 starts at version 0.2.0
          start_run = 2

          # Automatically increment patch number
          patch = run_number - start_run

          if patch < 0:
              raise SystemExit("Invalid package version")

          version = f"0.2.{patch}"

          content, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"',
              f'version = "{version}"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Package version not found")

          manifest.write_text(content)

          print(f"FleetFlow release version: {version}")
          PY

        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("wasmer.toml")
          content = manifest.read_text()

          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          version = f"0.2.{run_number * 1000 + attempt}"

          content, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"',
              f'version = "{version}"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Package version not found")

          manifest.write_text(content)
          print(f"Package version: {version}")
          PY

      - name: Setup Wasmer CLI
        uses: wasmerio/setup-wasmer@v3.1

      - name: Deploy FleetFlow
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          if [ -z "$WASMER_TOKEN" ]; then
            echo "WASMER_TOKEN is missing"
            exit 1
          fi

          wasmer deploy --non-interactive
