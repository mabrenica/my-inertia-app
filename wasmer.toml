[package]
name = "mabrenica_stormblue/fleetflow"
version = "0.1.53"
description = "FleetFlow Laravel Application"
private = false

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app/" = "."

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app/public", "-S", "localhost:8080"]