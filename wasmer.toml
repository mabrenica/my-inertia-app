[package]
name = "mabrenica_stormblue/fleetflow"
version = "0.1.52"
description = "FleetFlow Laravel Application"
private = true

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."

[[command]]
name = "run"
package = "php/php"
runner = "web"

[command.env]
PORT = "8080"
DOCUMENT_ROOT = "/app/public"
