[package]
name = "mabrenica_stormblue/fleetflow"
version = "0.1.51"
description = "FleetFlow Laravel Application"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "."

[build]
dockerfile = """
FROM debian:trixie-slim
RUN apt-get update && apt-get -y install curl unzip git php-cli php-mbstring php-xml php-bcmath
COPY . /app
WORKDIR /app
RUN curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
RUN composer install --no-dev --optimize-autoloader
"""

[[command]]
name = "run"
package = "php/php"
runner = "web"

[command.env]
PORT = "8080"
DOCUMENT_ROOT = "/app/public"